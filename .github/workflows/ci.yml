name: LA RED final checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: la_red_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/la_red_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/la_red_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run verify:db
      - run: npm run test:integration
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: https://api.example.invalid/api
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
