services:
  - type: web
    name: la-red-padle-api
    runtime: node
    branch: main
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 15
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - "*.md"
        - "**/*.md"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: es_AR
